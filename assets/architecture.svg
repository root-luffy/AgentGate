<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="AgentGate architecture: agents call the proxy on port 8080, which verifies the JWT, checks RBAC and forwards to upstream MCP servers; the admin UI talks to the admin API on port 8081; both share a key ring, a policy cache and PostgreSQL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34d399"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <!-- Title -->
    <text x="40" y="52" font-size="24" font-weight="700" fill="#f1f5f9">How AgentGate fits in</text>
    <text x="40" y="80" font-size="16" fill="#8fa3c0">One Rust binary, two ports, one Postgres database.</text>

    <!-- AgentGate container -->
    <rect x="300" y="104" width="580" height="468" rx="18" fill="#0d1a30" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="324" y="134" font-size="17" font-weight="700" fill="#67e8f9">AgentGate</text>
    <text x="424" y="134" font-size="15" fill="#8fa3c0">single binary · Rust · Axum · Tokio</text>

    <!-- Proxy lane -->
    <rect x="324" y="152" width="532" height="130" rx="14" fill="#10233f" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="344" y="182" font-size="18" font-weight="700" fill="#e2e8f0">Proxy</text>
    <text x="400" y="182" font-size="16" font-family="Cascadia Code, Consolas, Menlo, monospace" fill="#6ee7b7">:8080</text>
    <text x="836" y="182" text-anchor="end" font-size="14" fill="#8fa3c0">agent JWT required</text>
    <g font-size="16" font-weight="600" text-anchor="middle">
      <rect x="344" y="204" width="150" height="54" rx="10" fill="#0b1730" stroke="#38bdf8" stroke-opacity="0.7"/>
      <text x="419" y="237" fill="#bae6fd">Verify JWT</text>
      <rect x="515" y="204" width="150" height="54" rx="10" fill="#0b1730" stroke="#38bdf8" stroke-opacity="0.7"/>
      <text x="590" y="237" fill="#bae6fd">Check RBAC</text>
      <rect x="686" y="204" width="150" height="54" rx="10" fill="#0b1730" stroke="#34d399" stroke-opacity="0.8"/>
      <text x="761" y="237" fill="#a7f3d0">Forward</text>
    </g>
    <g fill="none" stroke="#7dd3fc" stroke-width="2">
      <line x1="494" y1="231" x2="513" y2="231" marker-end="url(#arr)"/>
      <line x1="665" y1="231" x2="684" y2="231" marker-end="url(#arr)"/>
    </g>

    <!-- Shared core -->
    <rect x="344" y="330" width="220" height="74" rx="12" fill="#1a1633" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="454" y="361" text-anchor="middle" font-size="17" font-weight="700" fill="#ddd6fe">KeyRing</text>
    <text x="454" y="386" text-anchor="middle" font-size="14" fill="#a5b4d0">RSA-2048 · signs + verifies</text>
    <rect x="616" y="330" width="220" height="74" rx="12" fill="#2a2110" stroke="#fbbf24" stroke-opacity="0.7"/>
    <text x="726" y="361" text-anchor="middle" font-size="17" font-weight="700" fill="#fde68a">Policy cache</text>
    <text x="726" y="386" text-anchor="middle" font-size="14" fill="#a5b4d0">in-memory · 60 s TTL</text>

    <!-- core arrows -->
    <line x1="419" y1="328" x2="419" y2="262" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrV)"/>
    <line x1="590" y1="262" x2="690" y2="328" stroke="#fbbf24" stroke-width="2" marker-start="url(#arrA)" marker-end="url(#arrA)"/>

    <!-- Admin lane -->
    <rect x="324" y="440" width="532" height="112" rx="14" fill="#10233f" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="344" y="470" font-size="18" font-weight="700" fill="#e2e8f0">Admin API</text>
    <text x="444" y="470" font-size="16" font-family="Cascadia Code, Consolas, Menlo, monospace" fill="#7dd3fc">:8081</text>
    <text x="836" y="470" text-anchor="end" font-size="14" fill="#8fa3c0">admin JWT required</text>
    <g font-size="15" font-weight="600" text-anchor="middle" fill="#cbd5e1">
      <rect x="344" y="490" width="74" height="40" rx="8" fill="#0b1730" stroke="#334d70"/>
      <text x="381" y="515">Login</text>
      <rect x="428" y="490" width="84" height="40" rx="8" fill="#0b1730" stroke="#334d70"/>
      <text x="470" y="515">Agents</text>
      <rect x="522" y="490" width="88" height="40" rx="8" fill="#0b1730" stroke="#334d70"/>
      <text x="566" y="515">Servers</text>
      <rect x="620" y="490" width="120" height="40" rx="8" fill="#0b1730" stroke="#fbbf24" stroke-opacity="0.7"/>
      <text x="680" y="515">Permissions</text>
      <rect x="750" y="490" width="86" height="40" rx="8" fill="#0b1730" stroke="#a78bfa" stroke-opacity="0.7"/>
      <text x="793" y="515">Tokens</text>
    </g>
    <line x1="454" y1="406" x2="454" y2="438" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrV)"/>
    <text x="464" y="427" font-size="13" fill="#a5b4d0">sign</text>
    <line x1="680" y1="488" x2="680" y2="408" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
    <text x="690" y="427" font-size="13" fill="#a5b4d0">invalidate on write</text>

    <!-- Agent client -->
    <rect x="40" y="168" width="210" height="98" rx="14" fill="#13213d" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="2"/>
    <text x="145" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#e0f2fe">AI agent</text>
    <text x="145" y="234" text-anchor="middle" font-size="14" fill="#a5b4d0">MCP client, JSON-RPC</text>
    <text x="145" y="254" text-anchor="middle" font-size="14" fill="#a5b4d0">Bearer agent token</text>
    <line x1="250" y1="231" x2="342" y2="231" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Admin client -->
    <rect x="40" y="448" width="210" height="98" rx="14" fill="#13213d" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="2"/>
    <text x="145" y="488" text-anchor="middle" font-size="19" font-weight="700" fill="#e0f2fe">Admin UI</text>
    <text x="145" y="514" text-anchor="middle" font-size="14" fill="#a5b4d0">Next.js 14</text>
    <text x="145" y="534" text-anchor="middle" font-size="14" font-family="Cascadia Code, Consolas, Menlo, monospace" fill="#a5b4d0">:3000</text>
    <line x1="250" y1="497" x2="342" y2="497" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="296" y="487" text-anchor="middle" font-size="13" fill="#a5b4d0">REST</text>

    <!-- Upstream MCP -->
    <rect x="950" y="168" width="210" height="98" rx="14" fill="#132a2a" stroke="#34d399" stroke-opacity="0.8" stroke-width="2"/>
    <text x="1055" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#d1fae5">MCP server(s)</text>
    <text x="1055" y="234" text-anchor="middle" font-size="14" fill="#a5b4d0">registered upstreams</text>
    <text x="1055" y="254" text-anchor="middle" font-size="14" fill="#a5b4d0">HTTP POST, JSON-RPC</text>
    <line x1="838" y1="231" x2="946" y2="231" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="892" y="220" text-anchor="middle" font-size="13" fill="#6ee7b7">allowed</text>

    <!-- Postgres -->
    <g>
      <path d="M960 400 L960 510 A95 20 0 0 0 1150 510 L1150 400" fill="#101f36" stroke="#60a5fa" stroke-width="2"/>
      <ellipse cx="1055" cy="400" rx="95" ry="20" fill="#16305a" stroke="#60a5fa" stroke-width="2"/>
      <text x="1055" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#dbeafe">PostgreSQL 16</text>
      <text x="1055" y="476" text-anchor="middle" font-size="14" fill="#a5b4d0">agents · servers</text>
      <text x="1055" y="496" text-anchor="middle" font-size="14" fill="#a5b4d0">permissions · tokens</text>
      <text x="1055" y="516" text-anchor="middle" font-size="14" fill="#a5b4d0">encrypted keys</text>
    </g>
    <line x1="882" y1="460" x2="956" y2="460" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="919" y="450" text-anchor="middle" font-size="13" fill="#a5b4d0">sqlx</text>
  </g>
</svg>
