<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="AgentGate: a security gateway that checks every AI agent tool call before it reaches an MCP server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.6" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#0a2233"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#2b5680"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <path id="p1" d="M756 120 C820 120 840 190 894 190 L966 190 C1004 190 1012 140 1050 140"/>
    <path id="p2" d="M756 190 L966 190 C1004 190 1012 240 1050 240"/>
    <path id="p3" d="M756 260 C806 260 822 250 838 250"/>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <circle cx="919" cy="190" r="190" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="72" y="160" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2"><tspan fill="#f1f5f9">Agent</tspan><tspan fill="url(#word)">Gate</tspan></text>
  <text x="76" y="207" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#b6c2d9">The security checkpoint between</text>
  <text x="76" y="240" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#b6c2d9">AI agents and their MCP tools.</text>

  <!-- Chips -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="76" y="272" width="108" height="34" rx="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="130" y="294" text-anchor="middle" fill="#67e8f9">RS256 JWT</text>
    <rect x="194" y="272" width="150" height="34" rx="17" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="269" y="294" text-anchor="middle" fill="#6ee7b7">Tool-level RBAC</text>
    <rect x="354" y="272" width="146" height="34" rx="17" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.5"/>
    <text x="427" y="294" text-anchor="middle" fill="#fda4af">Deny by default</text>
    <rect x="510" y="272" width="120" height="34" rx="17" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="570" y="294" text-anchor="middle" fill="#c4b5fd">Rust · Axum</text>
  </g>

  <!-- Traffic paths -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <use href="#p1" stroke="#34d399" stroke-opacity="0.55"/>
    <use href="#p2" stroke="#34d399" stroke-opacity="0.55"/>
    <use href="#p3" stroke="#f43f5e" stroke-opacity="0.8" stroke-dasharray="6 7"/>
  </g>

  <!-- Moving packets -->
  <g>
    <circle r="6" fill="#6ee7b7"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="6" fill="#6ee7b7"><animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="6" fill="#fda4af"><animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  </g>

  <!-- Agents -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <g transform="translate(700 92)">
      <rect width="56" height="56" rx="14" fill="#13213d" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
      <line x1="28" y1="0" x2="28" y2="-8" stroke="#38bdf8" stroke-width="2"/><circle cx="28" cy="-10" r="3" fill="#38bdf8"/>
      <circle cx="19" cy="26" r="5" fill="#7dd3fc"/><circle cx="37" cy="26" r="5" fill="#7dd3fc"/>
      <rect x="18" y="38" width="20" height="4" rx="2" fill="#7dd3fc" fill-opacity="0.6"/>
    </g>
    <g transform="translate(700 162)">
      <rect width="56" height="56" rx="14" fill="#13213d" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="19" cy="26" r="5" fill="#7dd3fc"/><circle cx="37" cy="26" r="5" fill="#7dd3fc"/>
      <rect x="18" y="38" width="20" height="4" rx="2" fill="#7dd3fc" fill-opacity="0.6"/>
    </g>
    <g transform="translate(700 232)">
      <rect width="56" height="56" rx="14" fill="#13213d" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="19" cy="26" r="5" fill="#7dd3fc"/><circle cx="37" cy="26" r="5" fill="#7dd3fc"/>
      <rect x="18" y="38" width="20" height="4" rx="2" fill="#7dd3fc" fill-opacity="0.6"/>
    </g>
    <text x="728" y="322" text-anchor="middle" font-size="15" fill="#8fa3c0">AI agents</text>
  </g>

  <!-- Blocked marker -->
  <g>
    <circle cx="852" cy="250" r="14" fill="#2a0f1a" stroke="#f43f5e" stroke-width="2.5"/>
    <path d="M846 244 L858 256 M858 244 L846 256" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
    <text x="852" y="288" text-anchor="middle" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#fb7185">403</text>
  </g>

  <!-- Gate -->
  <g>
    <rect x="894" y="108" width="50" height="184" fill="url(#portal)"/>
    <path d="M872 114 Q919 40 966 114" fill="none" stroke="#2b5680" stroke-width="12" stroke-linecap="round"/>
    <path d="M872 114 Q919 40 966 114" fill="none" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="872" y="104" width="22" height="192" rx="4" fill="url(#pillar)" stroke="#22d3ee" stroke-opacity="0.45"/>
    <rect x="944" y="104" width="22" height="192" rx="4" fill="url(#pillar)" stroke="#22d3ee" stroke-opacity="0.45"/>
    <rect x="866" y="292" width="34" height="8" rx="3" fill="#2b5680"/>
    <rect x="938" y="292" width="34" height="8" rx="3" fill="#2b5680"/>
    <!-- Shield -->
    <path d="M919 166 L940 174 L940 190 C940 204 931 212 919 217 C907 212 898 204 898 190 L898 174 Z" fill="#0b1730" stroke="#34d399" stroke-width="2.5"/>
    <path d="M910 190 L917 197 L929 183" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="919" y="322" text-anchor="middle" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="15" fill="#8fa3c0">proxy :8080</text>
  </g>

  <!-- MCP servers -->
  <g>
    <g transform="translate(1050 110)">
      <rect width="84" height="28" rx="6" fill="#132a2a" stroke="#34d399" stroke-opacity="0.6" stroke-width="2"/>
      <rect y="34" width="84" height="28" rx="6" fill="#132a2a" stroke="#34d399" stroke-opacity="0.6" stroke-width="2"/>
      <circle cx="14" cy="14" r="4" fill="#34d399"/><circle cx="14" cy="48" r="4" fill="#34d399"/>
      <rect x="28" y="12" width="42" height="4" rx="2" fill="#34d399" fill-opacity="0.4"/>
      <rect x="28" y="46" width="42" height="4" rx="2" fill="#34d399" fill-opacity="0.4"/>
    </g>
    <g transform="translate(1050 210)">
      <rect width="84" height="28" rx="6" fill="#132a2a" stroke="#34d399" stroke-opacity="0.6" stroke-width="2"/>
      <rect y="34" width="84" height="28" rx="6" fill="#132a2a" stroke="#34d399" stroke-opacity="0.6" stroke-width="2"/>
      <circle cx="14" cy="14" r="4" fill="#34d399"/><circle cx="14" cy="48" r="4" fill="#34d399"/>
      <rect x="28" y="12" width="42" height="4" rx="2" fill="#34d399" fill-opacity="0.4"/>
      <rect x="28" y="46" width="42" height="4" rx="2" fill="#34d399" fill-opacity="0.4"/>
    </g>
    <text x="1092" y="322" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8fa3c0">MCP servers</text>
  </g>
</svg>
